<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DriveReady UK Prototype V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface: #f8f9fa;
        --surface-low: #f1f4f6;
        --surface-card: #ffffff;
        --surface-dim: #d1dce0;
        --text: #2b3437;
        --text-muted: #667377;
        --outline: rgba(43, 52, 55, 0.12);
        --primary: #284c7d;
        --primary-dim: #446793;
        --primary-soft: #d9e3f7;
        --secondary: #6d7681;
        --secondary-soft: #e6eaee;
        --tertiary: #006d4a;
        --tertiary-soft: rgba(0, 109, 74, 0.12);
        --warning: #9f4a00;
        --warning-soft: rgba(159, 74, 0, 0.12);
        --error: #a02e2f;
        --error-soft: rgba(160, 46, 47, 0.12);
        --plate: #ffd300;
        --shadow: 0 24px 60px -24px rgba(43, 52, 55, 0.24);
        --ambient: 0 10px 30px -5px rgba(43, 52, 55, 0.06);
        --radius-xl: 32px;
        --radius-lg: 26px;
        --radius-md: 20px;
        --radius-sm: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Inter", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(68, 103, 147, 0.12), transparent 32%),
          radial-gradient(circle at bottom right, rgba(0, 109, 74, 0.12), transparent 28%),
          linear-gradient(180deg, #f7f8fa 0%, #eef2f4 100%);
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
      }

      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
        vertical-align: middle;
      }

      .app-layout {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(300px, 380px) minmax(360px, 1fr);
        gap: 28px;
        padding: 28px;
        align-items: start;
      }

      .panel {
        background: rgba(255, 255, 255, 0.76);
        backdrop-filter: blur(24px);
        border-radius: 34px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.9);
      }

      .sidebar {
        padding: 28px;
        position: sticky;
        top: 20px;
      }

      .eyebrow {
        margin: 0;
        color: var(--text-muted);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .sidebar h1 {
        margin: 14px 0 10px;
        font-size: 40px;
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .sidebar p {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.65;
      }

      .sidebar-stack {
        display: grid;
        gap: 24px;
        margin-top: 24px;
      }

      .summary-card,
      .sidebar-card {
        padding: 22px;
        border-radius: 26px;
        background: var(--surface-low);
      }

      .summary-grid,
      .scenario-grid,
      .screen-grid,
      .stats-grid,
      .dash-grid,
      .detail-grid {
        display: grid;
        gap: 12px;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 18px;
      }

      .summary-metric {
        padding: 16px;
        border-radius: 20px;
        background: var(--surface-card);
      }

      .summary-metric strong {
        display: block;
        font-size: 24px;
        letter-spacing: -0.05em;
      }

      .summary-metric span {
        display: block;
        margin-top: 6px;
        color: var(--text-muted);
        font-size: 12px;
      }

      .screen-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-top: 16px;
      }

      .route-chip,
      .scenario-chip {
        min-height: 52px;
        padding: 12px 14px;
        border-radius: 18px;
        text-align: left;
        background: var(--surface-card);
        box-shadow: inset 0 0 0 1px rgba(43, 52, 55, 0.06);
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
      }

      .route-chip:hover,
      .scenario-chip:hover {
        transform: translateY(-1px);
      }

      .route-chip.active,
      .scenario-chip.active {
        background: var(--primary-soft);
        box-shadow: inset 0 0 0 1px rgba(40, 76, 125, 0.08);
      }

      .route-chip strong,
      .scenario-chip strong {
        display: block;
        font-size: 13px;
      }

      .route-chip span,
      .scenario-chip span {
        display: block;
        margin-top: 4px;
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.5;
      }

      .sidebar-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .sidebar-button,
      .chip-button {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        background: var(--surface-card);
        color: var(--text);
        box-shadow: inset 0 0 0 1px rgba(43, 52, 55, 0.08);
        font-weight: 700;
      }

      .sidebar-button.primary {
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dim) 100%);
        color: #ffffff;
        box-shadow: 0 14px 28px -18px rgba(40, 76, 125, 0.7);
      }

      .phone-stage {
        display: flex;
        justify-content: center;
      }

      .device {
        width: min(430px, 100%);
        background: #17191c;
        border-radius: 46px;
        padding: 14px;
        box-shadow: 0 40px 80px -30px rgba(22, 27, 29, 0.46);
        position: sticky;
        top: 18px;
      }

      .phone {
        background: var(--surface);
        border-radius: 34px;
        overflow: hidden;
        min-height: 860px;
        position: relative;
      }

      .statusbar {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 22px 0;
        font-size: 13px;
        font-weight: 700;
      }

      .statusbar-dynamic {
        width: 132px;
        height: 30px;
        border-radius: 999px;
        background: #0a0b0d;
        margin: 0 auto;
      }

      .screen {
        min-height: 826px;
        position: relative;
      }

      .glass-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        padding: 14px 18px 14px;
        background: rgba(255, 255, 255, 0.82);
        backdrop-filter: blur(20px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .topbar-title {
        min-width: 0;
      }

      .topbar-title strong {
        display: block;
        font-size: 17px;
        line-height: 1.1;
      }

      .topbar-title span {
        display: block;
        margin-top: 4px;
        color: var(--text-muted);
        font-size: 12px;
      }

      .brandline,
      .left-inline,
      .inline,
      .field-row,
      .quick-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .avatar,
      .tiny-avatar,
      .icon-circle,
      .doc-icon,
      .metric-icon,
      .timeline-dot {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 16px;
        overflow: hidden;
        background: var(--surface-low);
      }

      .avatar img,
      .hero-card img,
      .vehicle-image img,
      .zone-thumb img,
      .hero-media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .icon-circle {
        width: 42px;
        height: 42px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: inset 0 0 0 1px rgba(43, 52, 55, 0.08);
        flex-shrink: 0;
      }

      .screen-body {
        padding: 10px 20px 130px;
      }

      .screen-body.no-nav {
        padding-bottom: 32px;
      }

      .stack-lg,
      .stack-md,
      .stack-sm,
      .timeline,
      .list-stack {
        display: grid;
      }

      .stack-lg {
        gap: 22px;
      }

      .stack-md {
        gap: 16px;
      }

      .stack-sm,
      .timeline,
      .list-stack {
        gap: 12px;
      }

      .display {
        margin: 0;
        font-size: 42px;
        line-height: 0.92;
        letter-spacing: -0.07em;
        font-weight: 900;
      }

      .headline {
        margin: 0;
        font-size: 30px;
        line-height: 1.02;
        letter-spacing: -0.06em;
        font-weight: 900;
      }

      .body-muted {
        margin: 0;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .hero-card,
      .card,
      .empty-state,
      .error-state,
      .loading-state {
        border-radius: var(--radius-lg);
        background: var(--surface-card);
        box-shadow: var(--ambient);
      }

      .hero-card {
        overflow: hidden;
        position: relative;
        min-height: 240px;
      }

      .hero-card .hero-overlay,
      .hero-media .hero-overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(12, 14, 16, 0.06) 0%, rgba(12, 14, 16, 0.68) 100%);
      }

      .hero-copy {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 18px;
        color: #ffffff;
        z-index: 2;
      }

      .trusted-pill,
      .hero-badge,
      .chip,
      .tag,
      .status-pair span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .trusted-pill,
      .hero-badge,
      .tag {
        background: rgba(255, 255, 255, 0.82);
        color: var(--text);
      }

      .chip.good,
      .status-pair .good {
        background: var(--tertiary-soft);
        color: var(--tertiary);
      }

      .chip.warning,
      .status-pair .warning {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .chip.error,
      .status-pair .error {
        background: var(--error-soft);
        color: var(--error);
      }

      .chip.neutral,
      .status-pair .neutral {
        background: rgba(68, 103, 147, 0.12);
        color: var(--primary);
      }

      .card {
        padding: 20px;
      }

      .split-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
      }

      .metric-card,
      .info-strip,
      .zone-card,
      .alert-card,
      .doc-card,
      .setting-row,
      .support-card,
      .vehicle-card,
      .service-item,
      .ownership-card {
        background: var(--surface-card);
        border-radius: 22px;
        box-shadow: var(--ambient);
      }

      .metric-card,
      .support-card,
      .ownership-card {
        padding: 18px;
      }

      .detail-grid,
      .dash-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric-card strong {
        display: block;
        font-size: 24px;
        letter-spacing: -0.05em;
      }

      .metric-card span,
      .muted-small {
        display: block;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .metric-icon,
      .doc-icon {
        width: 46px;
        height: 46px;
        border-radius: 16px;
        background: var(--surface-low);
        color: var(--primary);
        flex-shrink: 0;
      }

      .metric-icon.warning {
        background: var(--warning-soft);
        color: var(--warning);
      }

      .metric-icon.good {
        background: var(--tertiary-soft);
        color: var(--tertiary);
      }

      .feature-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 12px;
      }

      .feature-card {
        padding: 18px;
        border-radius: 24px;
        background: var(--surface-card);
        box-shadow: var(--ambient);
      }

      .feature-card h4,
      .card h4,
      .vehicle-card h4,
      .doc-card h4,
      .alert-card h4,
      .support-card h4 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.04em;
      }

      .feature-card p,
      .card p,
      .support-card p,
      .doc-card p,
      .alert-card p {
        margin: 8px 0 0;
        color: var(--text-muted);
        line-height: 1.55;
      }

      .primary-button,
      .secondary-button,
      .ghost-button,
      .danger-button {
        min-height: 52px;
        width: 100%;
        border-radius: 999px;
        font-weight: 800;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: transform 180ms ease, opacity 180ms ease;
      }

      .primary-button:hover,
      .secondary-button:hover,
      .ghost-button:hover,
      .danger-button:hover,
      .fab:hover {
        transform: scale(0.99);
      }

      .primary-button {
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dim) 100%);
        color: #ffffff;
        box-shadow: 0 18px 40px -26px rgba(40, 76, 125, 0.72);
      }

      .secondary-button {
        background: var(--secondary-soft);
        color: var(--text);
      }

      .ghost-button {
        background: transparent;
        color: var(--primary);
      }

      .danger-button {
        background: var(--error-soft);
        color: var(--error);
      }

      .form-card,
      .sheet-card {
        padding: 22px;
      }

      .form-grid {
        display: grid;
        gap: 14px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-muted);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .input,
      .select,
      .textarea,
      .search-input {
        width: 100%;
        min-height: 54px;
        border-radius: 18px;
        background: var(--surface-low);
        border: 1px solid rgba(43, 52, 55, 0.08);
        padding: 0 16px;
        color: var(--text);
      }

      .textarea {
        min-height: 110px;
        padding-top: 14px;
        resize: vertical;
      }

      .input:focus,
      .select:focus,
      .textarea:focus,
      .search-input:focus {
        outline: 2px solid rgba(40, 76, 125, 0.15);
        outline-offset: 0;
      }

      .field.error .input,
      .field.error .select,
      .field.error .textarea {
        border-color: rgba(160, 46, 47, 0.28);
        background: rgba(160, 46, 47, 0.05);
      }

      .error-copy {
        margin-top: 6px;
        color: var(--error);
        font-size: 12px;
      }

      .plate-shell {
        background: var(--plate);
        border-radius: 18px;
        min-height: 110px;
        padding: 10px;
        position: relative;
        box-shadow: inset 0 0 0 2px rgba(43, 52, 55, 0.08);
      }

      .plate-strip {
        position: absolute;
        left: 10px;
        top: 10px;
        bottom: 10px;
        width: 38px;
        border-radius: 12px;
        background: #1e56aa;
        color: #ffffff;
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.14em;
        display: flex;
        align-items: center;
        justify-content: center;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }

      .plate-input,
      .plate-badge {
        font-family: "Inter", sans-serif;
        font-weight: 900;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #141517;
      }

      .plate-input {
        width: 100%;
        min-height: 90px;
        background: transparent;
        border: 0;
        text-align: center;
        font-size: 42px;
        padding: 0 12px 0 50px;
      }

      .plate-input:focus {
        outline: none;
      }

      .plate-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 12px;
        background: var(--plate);
        box-shadow: inset 0 0 0 2px rgba(43, 52, 55, 0.06);
        font-size: 18px;
      }

      .vehicle-card,
      .doc-card,
      .alert-card,
      .zone-card,
      .service-item,
      .setting-row {
        padding: 18px;
      }

      .vehicle-card.selected,
      .zone-card.selected {
        background: var(--primary-soft);
      }

      .vehicle-top,
      .zone-top,
      .setting-row,
      .doc-card,
      .alert-card {
        display: grid;
        gap: 14px;
      }

      .vehicle-top,
      .zone-top {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: start;
      }

      .vehicle-footer,
      .doc-footer,
      .alert-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .vehicle-image,
      .zone-thumb,
      .hero-media {
        border-radius: 24px;
        overflow: hidden;
      }

      .vehicle-image {
        height: 150px;
        margin: 0 -6px;
      }

      .hero-media {
        height: 220px;
        position: relative;
      }

      .zone-card {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
      }

      .zone-thumb {
        width: 88px;
        height: 88px;
      }

      .search-shell {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 54px;
        border-radius: 18px;
        padding: 0 16px;
        background: var(--surface-card);
        box-shadow: var(--ambient);
      }

      .search-input {
        border: 0;
        background: transparent;
        padding: 0;
        min-height: 0;
      }

      .search-input:focus {
        outline: none;
      }

      .timeline {
        position: relative;
        padding-left: 14px;
      }

      .timeline::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 4px;
        bottom: 4px;
        width: 2px;
        background: rgba(43, 52, 55, 0.12);
      }

      .service-item {
        position: relative;
        padding-left: 20px;
      }

      .timeline-dot {
        position: absolute;
        left: -2px;
        top: 22px;
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: var(--tertiary);
        box-shadow: 0 0 0 4px rgba(0, 109, 74, 0.12);
      }

      .service-item small,
      .doc-meta,
      .alert-meta {
        color: var(--text-muted);
        font-size: 12px;
      }

      .ownership-card {
        display: grid;
        gap: 12px;
      }

      .status-pair {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .settings-group {
        display: grid;
        gap: 10px;
      }

      .setting-row {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
      }

      .setting-main {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .setting-copy strong,
      .section-title {
        display: block;
        font-size: 15px;
      }

      .setting-copy span {
        display: block;
        margin-top: 6px;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .toggle {
        position: relative;
        width: 52px;
        height: 30px;
        border-radius: 999px;
        background: rgba(43, 52, 55, 0.12);
        flex-shrink: 0;
      }

      .toggle::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: #ffffff;
        box-shadow: 0 4px 10px rgba(43, 52, 55, 0.12);
        transition: transform 180ms ease;
      }

      .toggle.on {
        background: rgba(0, 109, 74, 0.28);
      }

      .toggle.on::after {
        transform: translateX(22px);
      }

      .bottom-nav {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 14px;
        padding: 8px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.86);
        backdrop-filter: blur(20px);
        box-shadow: 0 -10px 30px -5px rgba(43, 52, 55, 0.08);
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 4px;
        z-index: 24;
      }

      .tab-button {
        min-height: 60px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        gap: 4px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        position: relative;
      }

      .tab-button.active {
        background: rgba(40, 76, 125, 0.1);
        color: var(--primary);
      }

      .tab-alert-dot {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--error);
        position: absolute;
        top: 12px;
        right: calc(50% - 18px);
      }

      .fab,
      .screen-picker {
        position: absolute;
        right: 20px;
        z-index: 26;
      }

      .fab {
        bottom: 102px;
        width: 60px;
        height: 60px;
        border-radius: 999px;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dim) 100%);
        color: #ffffff;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createInitialState();
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.version !== VERSION) return createInitialState();
          return parsed;
        } catch (error) {
          return createInitialState();
        }
      }

      let state = loadState();

      function persist() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function fullName() {
        return `${state.user.firstName} ${state.user.lastName}`;
      }

      function formatDate(dateString) {
        return new Intl.DateTimeFormat("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
        }).format(new Date(`${dateString}T12:00:00`));
      }

      function daysUntil(dateString) {
        const now = new Date();
        now.setHours(12, 0, 0, 0);
        const target = new Date(`${dateString}T12:00:00`);
        return Math.round((target - now) / 86400000);
      }

      function getVehicle(vehicleId = state.selectedVehicleId) {
        return state.vehicles.find((vehicle) => vehicle.id === vehicleId) || state.vehicles[0] || null;
      }

      function getDocument(documentId = state.selectedDocumentId) {
        return state.documents.find((document) => document.id === documentId) || state.documents[0] || null;
      }

      function getZone(zoneId = state.selectedZoneId) {
        return state.zones.find((zone) => zone.id === zoneId) || state.zones[0] || null;
      }

      function normalizeSelections() {
        if (!state.vehicles.length) {
          state.selectedVehicleId = null;
        } else if (!getVehicle(state.selectedVehicleId)) {
          state.selectedVehicleId = state.vehicles[0].id;
        }

        if (!state.documents.length) {
          state.selectedDocumentId = null;
        } else if (!getDocument(state.selectedDocumentId)) {
          state.selectedDocumentId = state.documents[0].id;
        }

        if (!state.zones.length) {
          state.selectedZoneId = null;
        } else if (!getZone(state.selectedZoneId)) {
          state.selectedZoneId = state.zones[0].id;
        }
      }

      function currentTab() {
        const map = {
          dashboard: "dashboard",
          garage: "garage",
          addVehicle: "garage",

      function isSignedInRoute() {
        return Boolean(currentTab());

      function severityFromDays(days) {
        if (days < 0) return "error";
        if (days <= 14) return "warning";
        return "good";
      }

      function labelFromDays(days, singular, plural) {
        if (days < 0) return `${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"} overdue`;
        if (days === 0) return `${singular} today`;
        return `${plural} in ${days} day${days === 1 ? "" : "s"}`;
      }

      function vehicleHealth(vehicle) {
        const insurance = daysUntil(vehicle.insuranceDue);
        const mot = daysUntil(vehicle.motDue);
        const tax = daysUntil(vehicle.taxDue);
        const lowest = Math.min(insurance, mot, tax);
        const tone = severityFromDays(lowest);
        const summary =
          lowest < 0
            ? `Immediate action required`
            : lowest <= 14
              ? `Action required before the next trip`
              : `Vehicle ready for the road`;
        return { insurance, mot, tax, tone, summary };
      }

      function documentStatus(document) {
        const days = daysUntil(document.expiresAt);
        return {
          days,
          tone: severityFromDays(days),
          label: days < 0 ? "Expired" : days <= 14 ? "Expiring soon" : "Current",
        };
      }

      function makeAlert(id, payload) {
        const defaults = state.alertDefaults[payload.kind] || { leadDays: 14, muted: false };
        const override = state.alertOverrides[id] || {};
        const leadDays = override.leadDays ?? defaults.leadDays;
        const muted = override.muted ?? defaults.muted;
        const resolved = override.resolved ?? false;
        return {
          id,
          leadDays,
          muted,
          resolved,
          ...payload,
        };
      }

      function computedAlerts() {
        const alerts = [];

        state.vehicles.forEach((vehicle) => {
          const entries = [
            ["insurance", vehicle.insuranceDue, "Insurance renewal", "Open the policy in Docs"],
            ["mot", vehicle.motDue, "MOT check", "Book a garage slot or upload the new certificate"],
            ["tax", vehicle.taxDue, "Vehicle tax", "Confirm payment or direct debit status"],
          ];

          entries.forEach(([kind, dueDate, title, actionLabel]) => {
            const id = `${vehicle.id}:${kind}`;
            const days = daysUntil(dueDate);
            const draft = makeAlert(id, {
              kind,
              vehicleId: vehicle.id,
              documentId: null,
              zoneId: null,
              title,
              subtitle: `${vehicle.nickname} · ${vehicle.plate}`,
              detail: actionLabel,
              dueDate,
              tone: severityFromDays(days),
              days,
            });
            if (days <= draft.leadDays || days < 0 || draft.resolved) {
              alerts.push(draft);
            }
          });

          if (vehicle.v5cStatus !== "Current") {
            const id = `${vehicle.id}:v5c`;
            alerts.push(
              makeAlert(id, {
                kind: "v5c",
                vehicleId: vehicle.id,
                documentId: "doc-v5c-1",
                zoneId: null,
                title: "V5C address review",
                subtitle: `${vehicle.nickname} keeper details need attention`,
                detail: "Update DVLA and replace the logbook copy in the vault",
                dueDate: isoOffset(5),
                tone: "warning",
                days: 5,
              })
            );
          }
        });

        state.documents.forEach((document) => {
          const days = daysUntil(document.expiresAt);
          const id = `${document.id}:document`;
          const draft = makeAlert(id, {
            kind: "document",
            vehicleId: document.vehicleId,
            documentId: document.id,
            zoneId: null,
            title: `${document.title} review`,
            subtitle: `${getVehicle(document.vehicleId)?.nickname || "Vehicle"} · ${document.format}`,
            detail: "Check the document date, replace if needed, and keep the vault current",
            dueDate: document.expiresAt,
            tone: severityFromDays(days),
            days,
          });
          if (days <= draft.leadDays || days < 0 || draft.resolved) {
            alerts.push(draft);
          }
        });

        state.zones
          .filter((zone) => zone.monitored && !zone.compliant)
          .forEach((zone) => {
            alerts.push(
              makeAlert(`${zone.id}:zone`, {
                kind: "zone",
                vehicleId: state.selectedVehicleId,
                documentId: null,
                zoneId: zone.id,
                title: `${zone.name} charge risk`,
                subtitle: `${zone.city} · ${zone.charge} daily charge`,
                detail: "This route may need a compliant vehicle or payment plan before travel",
                dueDate: isoOffset(0),
                tone: "error",
                days: 0,
              })
            );
          });

        return alerts.sort((a, b) => {
          if (a.resolved !== b.resolved) return a.resolved ? 1 : -1;
          return a.days - b.days;
        });
      }

      function selectedAlert() {
        const alerts = computedAlerts();
        return alerts.find((alert) => alert.id === state.selectedAlertId) || alerts[0] || null;
      }

      function visibleVehicles() {
        if (state.scenario === "emptyGarage") return [];
        return state.vehicles;
      }

      function visibleDocuments() {
        if (state.scenario === "emptyDocs") return [];

      function scenarioCopy() {
        const map = {
          default: "Normal seeded data",
          loading: "Show skeleton content",
          error: "Show error recovery state",
          emptyGarage: "Hide vehicle records",
          emptyDocs: "Hide document records",
        };
        return map[state.scenario];

      function showToast(message) {
        ui.toast = message;
        if (ui.toastTimer) clearTimeout(ui.toastTimer);
        ui.toastTimer = setTimeout(() => {
          ui.toast = "";
          render();
        }, 2600);
      }

      function navigate(route, params = {}, options = {}) {
        const { replace = false, reset = false } = options;
        if (!replace) {
          state.history = reset ? [] : [...state.history, { route: state.route, params: state.params }];
        } else if (reset) {
          state.history = [];
        }
        state.route = route;
        state.params = params;
        state.errors = {};
        persist();
        syncFormsToSelection();
        render();
      }

      function goBack(fallback = "dashboard") {
        const previous = state.history.pop();
        if (previous) {
          state.route = previous.route;
          state.params = previous.params || {};
        } else {
          state.route = fallback;
          state.params = {};
        }
        state.errors = {};
        persist();
        syncFormsToSelection();
        render();
      }

      function toggleSetting(group, key) {
        state[group][key] = !state[group][key];
        persist();
        render();
      }

      function setPermission(key, status) {
        state.permissionStatus[key] = status;
        persist();
        render();
      }

      function requestPermission(key) {
        const grants = {
          notifications: "granted",
          camera: "granted",
          files: "granted",
          biometrics: "granted",
        };
        state.permissionStatus[key] = grants[key];
        showToast(`${capitalize(key)} permission updated`);
        persist();
        render();
      }

      function capitalize(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function syncFormsToSelection() {
        normalizeSelections();

        const vehicle = getVehicle();
        if (vehicle) {
          state.forms.editVehicle = {
            nickname: vehicle.nickname,
            makeModel: vehicle.makeModel,
            fuelType: vehicle.fuelType,
            mileage: String(vehicle.mileage),
            motDue: vehicle.motDue,
            taxDue: vehicle.taxDue,
            insuranceDue: vehicle.insuranceDue,
            notes: vehicle.notes,
          };
          state.forms.uploadDocument.vehicleId = vehicle.id;
        }

        const document = getDocument();
        if (document) {
          state.forms.documentDetail = {
            title: document.title,
            type: document.type,
            expiresAt: document.expiresAt,
            source: document.source,
          };
        }

        const alert = selectedAlert();
        if (alert) {
          state.forms.alertDetail = {
            leadDays: String(alert.leadDays),
            muted: Boolean(alert.muted),
            resolved: Boolean(alert.resolved),
          };
        }

        state.forms.profile = {
          firstName: state.user.firstName,
          lastName: state.user.lastName,
          email: state.user.email,
          phone: state.user.phone,
          address: state.user.address,
          marketingOptIn: state.user.marketingOptIn,
        };
      }

      syncFormsToSelection();

      function metricSummaryCard(title, days, icon, prefix) {
        const tone = severityFromDays(days);
        return `
          <button class="metric-card" data-tab-open="${title === "Insurance" ? "docs" : "alerts"}" type="button">
            <div class="inline">
              <div class="metric-icon ${tone === "good" ? "good" : tone === "warning" ? "warning" : ""}">
                <span class="material-symbols-outlined">${escapeHtml(icon)}</span>
              </div>
              <div>
                <strong>${days < 0 ? Math.abs(days) : days}</strong>
                <span>${escapeHtml(prefix)} ${days < 0 ? "by" : ""} ${Math.abs(days)} day${Math.abs(days) === 1 ? "" : "s"}</span>
              </div>
            </div>
            <div class="status-pair" style="margin-top:14px"><span class="${tone}">${escapeHtml(title)}</span></div>
          </button>
        `;
      }

      function metricStaticCard(title, value, icon, copy) {
        return `
          <div class="metric-card">
            <div class="inline">
              <div class="metric-icon"><span class="material-symbols-outlined">${escapeHtml(icon)}</span></div>
              <div>
                <strong>${escapeHtml(value)}</strong>
                <span>${escapeHtml(copy)}</span>
              </div>
            </div>
            <div class="status-pair" style="margin-top:14px"><span class="neutral">${escapeHtml(title)}</span></div>
          </div>
        `;
      }

      function screenWithNav(top, body, showNav = true, showFab = false) {
        return `
          <div class="screen">
            ${top}
            ${body}
            ${showFab ? '<button class="fab" data-action="goto-upload-document"><span class="material-symbols-outlined">add_a_photo</span></button>' : ""}
            ${screenPickerButton()}
            ${showNav && isSignedInRoute() ? bottomNav() : ""}
            ${ui.screenPickerOpen ? screenPickerSheet() : ""}
            ${ui.modal ? modalSheet() : ""}
            ${ui.toast ? toastMarkup() : ""}
          </div>
        `;
      }

      function screenPickerButton() {
        return `
          <button class="screen-picker" data-action="toggle-screen-picker">
            <span class="material-symbols-outlined">widgets</span>
            Screens
          </button>
        `;
      }

      function screenPickerSheet() {
        const allRoutes = routeGroups.flatMap((group) => group.routes);
        return `
          <div class="overlay" data-action="close-screen-picker">
            <div class="sheet-card" data-stop-click="true">
              <div class="sheet-head">
                <div>
                  <div class="eyebrow">Prototype screens</div>
                  <h4 style="margin-top:10px">Jump anywhere</h4>
                </div>
                <button class="icon-circle" data-action="close-screen-picker">
                  <span class="material-symbols-outlined">close</span>
                </button>
              </div>
              <div class="destination-grid">
                ${allRoutes
                  .map(
                    ([route, label, description]) => `
                      <button class="destination-button ${state.route === route ? "active" : ""}" data-route-jump="${escapeHtml(route)}" type="button">
                        <strong>${escapeHtml(label)}</strong>
                        <span style="display:block;margin-top:6px;color:var(--text-muted);font-size:12px">${escapeHtml(description)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
            </div>
          </div>
        `;
      }

      function modalSheet() {
        if (!ui.modal) return "";
        const config = {
          deleteVehicle: {
            title: "Remove vehicle?",
            copy: "This deletes the vehicle, its documents and its reminder entries from the prototype.",
            confirm: "confirm-delete-vehicle",
            confirmLabel: "Delete vehicle",
          },
          deleteDocument: {
            title: "Delete document?",
            copy: "This removes the selected vault entry and any linked reminder.",
            confirm: "confirm-delete-document",
            confirmLabel: "Delete document",
          },
        }[ui.modal.type];
        if (!config) return "";
        return `
          <div class="overlay" data-action="close-modal">
            <div class="sheet-card" data-stop-click="true">
              <div class="sheet-head">
                <div>
                  <div class="eyebrow">Confirmation</div>
                  <h4 style="margin-top:10px">${escapeHtml(config.title)}</h4>
                  <p style="margin-top:8px">${escapeHtml(config.copy)}</p>
                </div>
                <button class="icon-circle" data-action="close-modal"><span class="material-symbols-outlined">close</span></button>
              </div>
              <div class="stack-md" style="margin-top:18px">
                <button class="danger-button" data-action="${escapeHtml(config.confirm)}">${escapeHtml(config.confirmLabel)}</button>
                <button class="secondary-button" data-action="close-modal">Cancel</button>
              </div>
            </div>
          </div>
        `;
      }

      function toastMarkup() {
        return `
          <div class="toast">
            <span>${escapeHtml(ui.toast)}</span>
            <button data-action="dismiss-toast"><span class="material-symbols-outlined">close</span></button>
          </div>
        `;
      }

      function bottomNav() {
        const alertsCount = computedAlerts().filter((alert) => !alert.resolved).length;
        const tabs = [
          ["dashboard", "dashboard", "Dashboard"],
          ["garage", "directions_car", "Garage"],
          ["alerts", "notifications_active", "Alerts"],
          ["docs", "description", "Docs"],
          ["settings", "settings", "Settings"],
        ];

        return `
          <nav class="bottom-nav">
            ${tabs
              .map(
                ([route, icon, label]) => `
                  <button class="tab-button ${currentTab() === route ? "active" : ""}" data-route-tab="${escapeHtml(route)}" type="button">
                    <span class="material-symbols-outlined">${escapeHtml(icon)}</span>
                    ${route === "alerts" && alertsCount ? '<span class="tab-alert-dot"></span>' : ""}
                    <small>${escapeHtml(label)}</small>
                  </button>
                `
              )
              .join("")}
          </nav>
        `;
      }

      function formField(form, field, label, type, value, error) {
        return `
          <div class="field ${error ? "error" : ""}" style="flex:1">
            <label>${escapeHtml(label)}</label>
            <input class="input" type="${escapeHtml(type)}" data-form="${escapeHtml(form)}" data-field="${escapeHtml(field)}" value="${escapeHtml(value)}" />
            ${error ? `<div class="error-copy">${escapeHtml(error)}</div>` : ""}
          </div>
        `;
      }

      function selectField(form, field, label, options, value, error, pair = false) {
        const normalized = pair ? options : options.map((item) => [item, item]);
        return `
          <div class="field ${error ? "error" : ""}">
            <label>${escapeHtml(label)}</label>
            <select class="select" data-form="${escapeHtml(form)}" data-field="${escapeHtml(field)}">
              ${normalized
                .map(
                  ([optionValue, optionLabel]) => `
                    <option value="${escapeHtml(optionValue)}" ${value === optionValue ? "selected" : ""}>${escapeHtml(optionLabel)}</option>
                  `
                )
                .join("")}
            </select>
            ${error ? `<div class="error-copy">${escapeHtml(error)}</div>` : ""}
          </div>
        `;
      }

      function textareaField(form, field, label, value, error) {
        return `
          <div class="field ${error ? "error" : ""}">
            <label>${escapeHtml(label)}</label>
            <textarea class="textarea" data-form="${escapeHtml(form)}" data-field="${escapeHtml(field)}">${escapeHtml(value)}</textarea>
            ${error ? `<div class="error-copy">${escapeHtml(error)}</div>` : ""}
          </div>
        `;
      }

      function segment(kind, value, active, label) {
        return `<button class="segment-button ${active ? "active" : ""}" data-segment="${escapeHtml(kind)}" data-value="${escapeHtml(value)}" type="button">${escapeHtml(label)}</button>`;
      }

      function toggleRow(group, key, icon, title, subtitle, self = false) {
        const collection = self ? state : state[group];
        const active = Boolean(collection[key]);
        return `
          <button class="setting-row" data-toggle-setting="${escapeHtml(group)}:${escapeHtml(key)}" type="button">
            <div class="setting-main">
              <div class="metric-icon"><span class="material-symbols-outlined">${escapeHtml(icon)}</span></div>
              <div class="setting-copy">
                <strong>${escapeHtml(title)}</strong>
                <span>${escapeHtml(subtitle)}</span>
              </div>
            </div>
            <div class="toggle ${active ? "on" : ""}"></div>
          </button>
        `;
      }

      function permissionRow(key, title, subtitle) {
        return `
          <button class="setting-row" data-request-permission="${escapeHtml(key)}" type="button">
            <div class="setting-main">
              <div class="metric-icon"><span class="material-symbols-outlined">security</span></div>
              <div class="setting-copy">
                <strong>${escapeHtml(title)}</strong>
                <span>${escapeHtml(subtitle)}</span>
              </div>
            </div>
            <div class="status-pair"><span class="${state.permissionStatus[key] === "granted" ? "good" : "warning"}">${escapeHtml(state.permissionStatus[key])}</span></div>
          </button>
        `;
      }

      function validateEmail(value) {
        return /\S+@\S+\.\S+/.test(value);
      }

      function validatePlate(value) {
        return /^[A-Z0-9 ]{5,8}$/.test(value.trim().toUpperCase());
      }

      function clearErrors() {
        state.errors = {};
      }

      function setErrors(form, errors) {
        state.errors[form] = errors;
      }

      function validateSignIn() {
        const errors = {};
        if (!validateEmail(state.forms.signIn.email)) errors.email = "Enter a valid email address.";
        if (!state.forms.signIn.password || state.forms.signIn.password.length < 6) errors.password = "Use at least 6 characters.";
        setErrors("signIn", errors);
        return Object.keys(errors).length === 0;
      }

      function validateSignUp() {
        const form = state.forms.signUp;
        const errors = {};
        if (!form.firstName.trim()) errors.firstName = "Required.";
        if (!form.lastName.trim()) errors.lastName = "Required.";
        if (!validateEmail(form.email)) errors.email = "Enter a valid email address.";
        if (!form.phone.trim()) errors.phone = "Required.";
        if (form.password.length < 6) errors.password = "Use at least 6 characters.";
        if (form.confirmPassword !== form.password) errors.confirmPassword = "Passwords must match.";
        if (!form.acceptedTerms) errors.acceptedTerms = "You must accept the terms.";
        setErrors("signUp", errors);
        return Object.keys(errors).length === 0;
      }

      function validateForgotPassword() {
        const errors = {};
        if (!validateEmail(state.forms.forgotPassword.email)) errors.email = "Enter a valid email address.";
        setErrors("forgotPassword", errors);
        return Object.keys(errors).length === 0;
      }

      function validateAddVehicle() {
        const form = state.forms.addVehicle;
        const errors = {};
        if (!validatePlate(form.plate)) errors.plate = "Enter a valid UK-style registration.";
        if (!form.nickname.trim()) errors.nickname = "Required.";
        if (!form.makeModel.trim()) errors.makeModel = "Required.";
        if (!form.mileage || Number(form.mileage) < 0) errors.mileage = "Enter a valid mileage.";
        setErrors("addVehicle", errors);
        return Object.keys(errors).length === 0;
      }

      function validateEditVehicle() {
        const form = state.forms.editVehicle;
        const errors = {};
        if (!form.nickname.trim()) errors.nickname = "Required.";
        if (!form.makeModel.trim()) errors.makeModel = "Required.";
        if (!form.mileage || Number(form.mileage) < 0) errors.mileage = "Enter a valid mileage.";
        if (!form.motDue) errors.motDue = "Required.";
        if (!form.taxDue) errors.taxDue = "Required.";
        if (!form.insuranceDue) errors.insuranceDue = "Required.";
        setErrors("editVehicle", errors);
        return Object.keys(errors).length === 0;
      }

      function validateUploadDocument() {
        const form = state.forms.uploadDocument;
        const errors = {};
        if (!form.vehicleId) errors.vehicleId = "Choose a vehicle.";
        if (!form.title.trim()) errors.title = "Required.";
        if (!form.expiresAt) errors.expiresAt = "Required.";
        if (!form.sizeMb || Number(form.sizeMb) <= 0) errors.sizeMb = "Enter a valid file size.";
        if (form.source === "camera" && state.permissionStatus.camera !== "granted") errors.source = "Camera permission is required.";
        if (form.source === "files" && state.permissionStatus.files !== "granted") errors.source = "File access is required.";
        setErrors("uploadDocument", errors);
        return Object.keys(errors).length === 0;
      }

      function validateDocumentDetail() {
        const form = state.forms.documentDetail;
        const errors = {};
        if (!form.title.trim()) errors.title = "Required.";
        if (!form.expiresAt) errors.expiresAt = "Required.";
        if (form.source === "camera" && state.permissionStatus.camera !== "granted") errors.source = "Camera permission is required.";
        setErrors("documentDetail", errors);
        return Object.keys(errors).length === 0;
      }

      function validateAlertDetail() {
        const errors = {};
        const leadDays = Number(state.forms.alertDetail.leadDays);
        if (!Number.isFinite(leadDays) || leadDays < 0) errors.leadDays = "Enter 0 or more days.";
        setErrors("alertDetail", errors);
        return Object.keys(errors).length === 0;
      }

      function validateProfile() {
        const form = state.forms.profile;
        const errors = {};
        if (!form.firstName.trim()) errors.firstName = "Required.";
        if (!form.lastName.trim()) errors.lastName = "Required.";
        if (!validateEmail(form.email)) errors.email = "Enter a valid email address.";
        if (!form.phone.trim()) errors.phone = "Required.";
        if (!form.address.trim()) errors.address = "Required.";
        setErrors("profile", errors);
        return Object.keys(errors).length === 0;
      }

      function validateZone() {
        const form = state.forms.zone;
        const errors = {};
        if (!form.name.trim()) errors.name = "Required.";
        if (!form.city.trim()) errors.city = "Required.";
        if (!form.charge.trim()) errors.charge = "Required.";
        if (!form.route.trim()) errors.route = "Required.";
        setErrors("zone", errors);
        return Object.keys(errors).length === 0;
      }

      function submitSignIn() {
        clearErrors();
        if (!validateSignIn()) {
          render();
          return;
        }
        state.user.email = state.forms.signIn.email.trim();
        navigate("dashboard", {}, { reset: true });
        showToast("Signed in");
      }

      function submitSignUp() {
        clearErrors();
        if (!validateSignUp()) {
          render();
          return;
        }
        state.user.firstName = state.forms.signUp.firstName.trim();
        state.user.lastName = state.forms.signUp.lastName.trim();
        state.user.email = state.forms.signUp.email.trim();
        state.user.phone = state.forms.signUp.phone.trim();
        navigate("dashboard", {}, { reset: true });
        showToast("Account created");
      }

      function submitForgotPassword() {
        clearErrors();
        if (!validateForgotPassword()) {
          render();
          return;
        }
        navigate("signIn", {}, { reset: true });
        showToast(`Reset link sent to ${state.forms.forgotPassword.email}`);
      }

      function submitAddVehicle() {
        clearErrors();
        if (!validateAddVehicle()) {
          render();
          return;
        }
        const id = `veh-${Date.now()}`;
        state.vehicles.unshift({
          id,
          nickname: state.forms.addVehicle.nickname.trim(),
          makeModel: state.forms.addVehicle.makeModel.trim(),
          subtitle: "Newly added vehicle",
          plate: state.forms.addVehicle.plate.trim().toUpperCase(),
          fuelType: state.forms.addVehicle.fuelType,
          motDue: isoOffset(30),
          taxDue: isoOffset(45),
          insuranceDue: isoOffset(20),
          mileage: Number(state.forms.addVehicle.mileage),
          notes: state.forms.addVehicle.notes.trim(),
          image:
            "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80",
          v5cStatus: "Current",
          zoneIds: ["zone-1"],
          serviceHistory: [{ date: isoOffset(0), title: "Vehicle added", note: "Record created in prototype" }],
        });
        state.selectedVehicleId = id;
        state.forms.addVehicle = {
          plate: "",
          nickname: "",
          makeModel: "",
          fuelType: "Petrol",
          mileage: "",
          notes: "",
        };
        syncFormsToSelection();
        persist();
        navigate("vehicleDetail", { vehicleId: id });
        showToast("Vehicle added");
      }

      function saveVehicleEdits() {
        clearErrors();
        if (!validateEditVehicle()) {
          render();
          return;
        }
        const vehicle = getVehicle();
        if (!vehicle) return;
        Object.assign(vehicle, {
          nickname: state.forms.editVehicle.nickname.trim(),
          makeModel: state.forms.editVehicle.makeModel.trim(),
          fuelType: state.forms.editVehicle.fuelType,
          mileage: Number(state.forms.editVehicle.mileage),
          motDue: state.forms.editVehicle.motDue,
          taxDue: state.forms.editVehicle.taxDue,
          insuranceDue: state.forms.editVehicle.insuranceDue,
          notes: state.forms.editVehicle.notes.trim(),
        });
        persist();
        navigate("vehicleDetail");
        showToast("Vehicle updated");
      }

      function submitUploadDocument() {
        clearErrors();
        if (!validateUploadDocument()) {
          render();
          return;
        }
        const form = state.forms.uploadDocument;
        const id = `doc-${Date.now()}`;
        state.documents.unshift({
          id,
          vehicleId: form.vehicleId,
          type: form.type,
          title: form.title.trim(),
          format: form.format,
          sizeMb: Number(form.sizeMb),
          uploadedAt: isoOffset(0),
          expiresAt: form.expiresAt,
          source: form.source,
          preview: `${form.type} imported via ${form.source === "camera" ? "camera scan" : "files"} flow in the prototype.`,
        });
        state.selectedDocumentId = id;
        state.forms.uploadDocument.title = "";
        persist();
        syncFormsToSelection();
        navigate("documentDetail");
        showToast("Document stored");
      }

      function saveDocumentDetail() {
        clearErrors();
        if (!validateDocumentDetail()) {
          render();
          return;
        }
        const document = getDocument();
        if (!document) return;
        Object.assign(document, {
          title: state.forms.documentDetail.title.trim(),
          type: state.forms.documentDetail.type,
          expiresAt: state.forms.documentDetail.expiresAt,
          source: state.forms.documentDetail.source,
        });
        persist();
        navigate("docs");
        showToast("Document metadata saved");
      }

      function saveAlertDetail() {
        clearErrors();
        if (!validateAlertDetail()) {
          render();
          return;
        }
        const alert = selectedAlert();
        if (!alert) return;
        state.alertOverrides[alert.id] = {
          leadDays: Number(state.forms.alertDetail.leadDays),
          muted: Boolean(state.forms.alertDetail.muted),
          resolved: Boolean(state.forms.alertDetail.resolved),
        };
        persist();
        navigate("alerts");
        showToast("Reminder settings saved");
      }

      function saveProfile() {
        clearErrors();
        if (!validateProfile()) {
          render();
          return;
        }
        Object.assign(state.user, {
          firstName: state.forms.profile.firstName.trim(),
          lastName: state.forms.profile.lastName.trim(),
          email: state.forms.profile.email.trim(),
          phone: state.forms.profile.phone.trim(),
          address: state.forms.profile.address.trim(),
          marketingOptIn: Boolean(state.forms.profile.marketingOptIn),
        });
        persist();
        navigate("settings");
        showToast("Profile updated");
      }

      function submitZone() {
        clearErrors();
        if (!validateZone()) {
          render();
          return;
        }
        const id = `zone-${Date.now()}`;
        state.zones.unshift({
          id,
          name: state.forms.zone.name.trim(),
          city: state.forms.zone.city.trim(),
          charge: state.forms.zone.charge.trim(),
          route: state.forms.zone.route.trim(),
          compliant: true,
          monitored: true,
          image:
            "https://images.unsplash.com/photo-1515548217831-8c7d144ac6a3?auto=format&fit=crop&w=900&q=80",
        });
        state.selectedZoneId = id;
        state.forms.zone = { name: "", city: "", charge: "£10.00", route: "" };
        persist();
        navigate("zoneManager");
        showToast("Zone added");
      }

      function renderSidebar() {
        const alerts = computedAlerts();
        const vehicles = visibleVehicles();
        const docs = visibleDocuments();

        sidebar.innerHTML = `
          <p class="eyebrow">DriveReady HTML V2</p>
          <h1>Expanded prototype.</h1>
          <p>This page closes the missing-product gaps from the first HTML prototype and keeps everything local so you can inspect the flows quickly.</p>

          <div class="sidebar-stack">
            <section class="summary-card">
              <div class="eyebrow">Live summary</div>
              <div class="summary-grid">
                <div class="summary-metric">
                  <strong>${vehicles.length}</strong>
                  <span>Vehicles</span>
                </div>
                <div class="summary-metric">
                  <strong>${docs.length}</strong>
                  <span>Documents</span>
                </div>
                <div class="summary-metric">
                  <strong>${alerts.filter((alert) => !alert.resolved).length}</strong>
                  <span>Open alerts</span>
                </div>
                <div class="summary-metric">
                  <strong>${scenarioCopy()}</strong>
                  <span>Scenario</span>
                </div>
              </div>
            </section>

            ${routeGroups
              .map(
                (group) => `
                  <section class="sidebar-card">
                    <div class="eyebrow">${escapeHtml(group.title)}</div>
                    <div class="screen-grid">
                      ${group.routes
                        .map(
                          ([route, label, description]) => `
                            <button class="route-chip ${state.route === route ? "active" : ""}" data-route-jump="${escapeHtml(route)}" type="button">
                              <strong>${escapeHtml(label)}</strong>
                              <span>${escapeHtml(description)}</span>
                            </button>
                          `
                        )
                        .join("")}
                    </div>
                  </section>
                `
              )
              .join("")}

            <section class="sidebar-card">
              <div class="eyebrow">Prototype lab</div>
              <div class="scenario-grid" style="margin-top:16px">
                ${[
                  ["default", "Default", "Seeded content"],
                  ["loading", "Loading", "Skeleton UI"],
                  ["error", "Error", "Recovery state"],
                  ["emptyGarage", "Empty garage", "No vehicles"],
                  ["emptyDocs", "Empty docs", "No vault items"],
                ]
                  .map(
                    ([value, label, description]) => `
                      <button class="scenario-chip ${state.scenario === value ? "active" : ""}" data-scenario="${escapeHtml(value)}" type="button">
                        <strong>${escapeHtml(label)}</strong>
                        <span>${escapeHtml(description)}</span>
                      </button>
                    `
                  )
                  .join("")}
              </div>
              <div class="sidebar-actions">
                <button class="sidebar-button primary" data-action="reset-demo">Reset demo</button>
                <button class="sidebar-button" data-action="open-dashboard">Open dashboard</button>
              </div>
            </section>
          </div>
        `;
      }

      function renderPhone() {
        normalizeSelections();
        const screens = {
          welcome: welcomeScreen,
          features: featuresScreen,
          signIn: signInScreen,
          signUp: signUpScreen,
          forgotPassword: forgotPasswordScreen,
          dashboard: dashboardScreen,
          garage: garageScreen,
          addVehicle: addVehicleScreen,
          vehicleDetail: vehicleDetailScreen,
          editVehicle: editVehicleScreen,
          alerts: alertsScreen,
          alertDetail: alertDetailScreen,
          zoneManager: zoneManagerScreen,
          docs: docsScreen,
          uploadDocument: uploadDocumentScreen,
          documentDetail: documentDetailScreen,
          settings: settingsScreen,
          profile: profileScreen,
          support: supportScreen,
        };

        phoneRoot.innerHTML = screens[state.route]();
      }

      function render() {
        persist();
        renderSidebar();
        renderPhone();
      }

      function openAlert(alertId) {
        state.selectedAlertId = alertId;
        syncFormsToSelection();
        navigate("alertDetail");
      }

      function openDocument(documentId) {
        state.selectedDocumentId = documentId;
        syncFormsToSelection();
        navigate("documentDetail");
      }

      function openVehicle(vehicleId) {
        state.selectedVehicleId = vehicleId;
        syncFormsToSelection();
        navigate("vehicleDetail");
      }

      function jumpToRoute(route) {
        const config = {
          alertDetail: () => {
            const firstAlert = computedAlerts()[0];
            if (firstAlert) state.selectedAlertId = firstAlert.id;
          },
          documentDetail: () => {
            const firstDocument = state.documents[0];
            if (firstDocument) state.selectedDocumentId = firstDocument.id;
          },
          vehicleDetail: () => {
            const firstVehicle = state.vehicles[0];
            if (firstVehicle) state.selectedVehicleId = firstVehicle.id;
          },
          editVehicle: () => {
            const firstVehicle = state.vehicles[0];
            if (firstVehicle) state.selectedVehicleId = firstVehicle.id;
          },
        }[route];

        if (config) config();
        ui.screenPickerOpen = false;
        navigate(route);
      }

      document.addEventListener("click", (event) => {
        const routeJump = event.target.closest("[data-route-jump]");
        if (routeJump) {
          jumpToRoute(routeJump.dataset.routeJump);
          return;
        }

        const scenarioNode = event.target.closest("[data-scenario]");
        if (scenarioNode) {
          state.scenario = scenarioNode.dataset.scenario;
          render();
          return;
        }

        const tabNode = event.target.closest("[data-route-tab]");
        if (tabNode) {
          navigate(tabNode.dataset.routeTab, {}, { replace: true });
          return;
        }

        const metricRouteNode = event.target.closest("[data-tab-open]");
        if (metricRouteNode) {
          navigate(metricRouteNode.dataset.tabOpen);
          return;
        }

        const segmentNode = event.target.closest("[data-segment]");
        if (segmentNode) {
          const kind = segmentNode.dataset.segment;
          const value = segmentNode.dataset.value;
          if (kind === "upload-source") state.forms.uploadDocument.source = value;
          if (kind === "document-source") state.forms.documentDetail.source = value;
          render();
          return;
        }

        const toggleNode = event.target.closest("[data-toggle-setting]");
        if (toggleNode) {
          const [group, key] = toggleNode.dataset.toggleSetting.split(":");
          if (group === "self") {
            state[key] = !state[key];
          } else {
            toggleSetting(group, key);
            return;
          }
          persist();
          render();
          return;
        }

        const permissionNode = event.target.closest("[data-request-permission]");
        if (permissionNode) {
          requestPermission(permissionNode.dataset.requestPermission);
          return;
        }

        const vehicleSelectNode = event.target.closest("[data-select-vehicle]");
        if (vehicleSelectNode) {
          state.selectedVehicleId = vehicleSelectNode.dataset.selectVehicle;
          persist();
          render();
          return;
        }

        const vehicleOpenNode = event.target.closest("[data-open-vehicle]");
        if (vehicleOpenNode) {
          openVehicle(vehicleOpenNode.dataset.openVehicle);
          return;
        }

        const vehicleEditNode = event.target.closest("[data-edit-vehicle]");
        if (vehicleEditNode) {
          state.selectedVehicleId = vehicleEditNode.dataset.editVehicle;
          syncFormsToSelection();
          navigate("editVehicle");
          return;
        }

        const documentNode = event.target.closest("[data-open-document]");
        if (documentNode) {
          openDocument(documentNode.dataset.openDocument);
          return;
        }

        const alertNode = event.target.closest("[data-open-alert]");
        if (alertNode) {
          openAlert(alertNode.dataset.openAlert);
          return;
        }

        const zoneNode = event.target.closest("[data-open-zone]");
        if (zoneNode) {
          state.selectedZoneId = zoneNode.dataset.openZone;
          navigate("zoneManager");
          return;
        }

        const zoneToggleNode = event.target.closest("[data-toggle-zone]");
        if (zoneToggleNode) {
          const zone = getZone(zoneToggleNode.dataset.toggleZone);
          if (zone) {
            zone.monitored = !zone.monitored;
            showToast(zone.monitored ? "Zone monitoring resumed" : "Zone monitoring paused");
            persist();
            render();
          }
          return;
        }

        const zoneDeleteNode = event.target.closest("[data-delete-zone]");
        if (zoneDeleteNode) {
          state.zones = state.zones.filter((zone) => zone.id !== zoneDeleteNode.dataset.deleteZone);
          normalizeSelections();
          showToast("Zone removed");
          render();
          return;
        }

        const actionNode = event.target.closest("[data-action]");
        if (!actionNode) return;
        const action = actionNode.dataset.action;

        switch (action) {
          case "back":
            goBack();
            break;
          case "goto-features":
            navigate("features");
            break;
          case "goto-sign-in":
            navigate("signIn");
            break;
          case "goto-sign-up":
            navigate("signUp");
            break;
          case "goto-forgot":
            navigate("forgotPassword");
            break;
          case "goto-settings":
            navigate("settings");
            break;
          case "goto-docs":
            navigate("docs");
            break;
          case "goto-alerts":
            navigate("alerts");
            break;
          case "goto-profile":
            navigate("profile");
            break;
          case "goto-support":
            navigate("support");
            break;
          case "goto-upload-document":
            navigate("uploadDocument");
            break;
          case "goto-zone-manager":
            navigate("zoneManager");
            break;
          case "goto-add-vehicle":
            navigate("addVehicle");
            break;
          case "goto-vehicle-detail":
            navigate("vehicleDetail");
            break;
          case "goto-edit-vehicle":
            navigate("editVehicle");
            break;
          case "submit-sign-in":
            submitSignIn();
            break;
          case "submit-sign-up":
            submitSignUp();
            break;
          case "submit-forgot-password":
            submitForgotPassword();
            break;
          case "submit-add-vehicle":
            submitAddVehicle();
            break;
          case "save-vehicle-edits":
            saveVehicleEdits();
            break;
          case "submit-upload-document":
            submitUploadDocument();
            break;
          case "save-document-detail":
            saveDocumentDetail();
            break;
          case "save-alert-detail":
            saveAlertDetail();
            break;
          case "save-profile":
            saveProfile();
            break;
          case "submit-zone":
            submitZone();
            break;
          case "toggle-sign-up-terms":
            state.forms.signUp.acceptedTerms = !state.forms.signUp.acceptedTerms;
            render();
            break;
          case "toggle-marketing":
            state.forms.profile.marketingOptIn = !state.forms.profile.marketingOptIn;
            render();
            break;
          case "toggle-alert-muted":
            state.forms.alertDetail.muted = !state.forms.alertDetail.muted;
            render();
            break;
          case "toggle-alert-resolved":
            state.forms.alertDetail.resolved = !state.forms.alertDetail.resolved;
            render();
            break;
          case "grant-notifications":
            setPermission("notifications", "granted");
            showToast("Notifications enabled");
            break;
          case "deny-notifications":
            setPermission("notifications", "denied");
            showToast("Notifications denied");
            break;
          case "request-camera":
            requestPermission("camera");
            break;
          case "request-files":
            requestPermission("files");
            break;
          case "request-biometrics":
            requestPermission("biometrics");
            state.biometricEnabled = true;
            break;
          case "biometric-sign-in":
            navigate("dashboard", {}, { reset: true });
            showToast("Signed in with biometrics");
            break;
          case "replace-document": {
            const document = getDocument();
            if (document) {
              document.uploadedAt = isoOffset(0);
              document.preview = "Prototype replacement complete. New file version stored.";
              persist();
              showToast("Document replaced");
              render();
            }
            break;
          }
          case "share-document":
            showToast("Share sheet simulated");
            break;
          case "prompt-delete-document":
            ui.modal = { type: "deleteDocument" };
            render();
            break;
          case "prompt-delete-vehicle":
            ui.modal = { type: "deleteVehicle" };
            render();
            break;
          case "confirm-delete-document": {
            const document = getDocument();
            if (document) {
              state.documents = state.documents.filter((item) => item.id !== document.id);
              ui.modal = null;
              normalizeSelections();
              persist();
              navigate("docs");
              showToast("Document deleted");
            }
            break;
          }
          case "confirm-delete-vehicle": {
            const vehicle = getVehicle();
            if (vehicle) {
              state.documents = state.documents.filter((document) => document.vehicleId !== vehicle.id);
              state.vehicles = state.vehicles.filter((item) => item.id !== vehicle.id);
              ui.modal = null;
              normalizeSelections();
              persist();
              navigate("garage");
              showToast("Vehicle removed");
            }
            break;
          }
          case "close-modal":
            ui.modal = null;
            render();
            break;
          case "toggle-screen-picker":
            ui.screenPickerOpen = !ui.screenPickerOpen;
            render();
            break;
          case "close-screen-picker":
            ui.screenPickerOpen = false;
            render();
            break;
          case "dismiss-toast":
            ui.toast = "";
            render();
            break;
          case "retry-scenario":
            state.scenario = "default";
            render();
            break;
          case "mark-all-handled":
            computedAlerts()
              .filter((alert) => !alert.resolved)
              .forEach((alert) => {
                state.alertOverrides[alert.id] = {
                  leadDays: alert.leadDays,
                  muted: alert.muted,
                  resolved: true,
                };
              });
            persist();
            showToast("Visible alerts marked handled");
            render();
            break;
          case "reset-demo":
            resetDemo();
            break;
          case "open-dashboard":
            navigate("dashboard");
            break;
          case "contact-support":
            showToast("Support email composer simulated");
            break;
          case "open-help-centre":
            showToast("Help centre article list simulated");
            break;
          case "export-data":
            showToast("Data export queued");
            break;
          case "sign-out":
            navigate("signIn", {}, { reset: true });
            showToast("Signed out");
            break;
          default:
            break;
        }
      });

      document.addEventListener("input", (event) => {
        const form = event.target.dataset.form;
        const field = event.target.dataset.field;
        if (!form || !field) return;

        let value = event.target.value;
        if (form === "addVehicle" && field === "plate") {
          value = value.toUpperCase();
          event.target.value = value;
        }

        if (form === "signUp" && field === "acceptedTerms") return;
        state.forms[form][field] = value;
        if (state.errors[form]) delete state.errors[form][field];
        persist();
        if (form === "search") render();
      });

      render();
    </script>
  </body>
</html>
