<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }

            outline: none;
            box-shadow: 0 0 0 2px rgba(93, 94, 97, 0.1);
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation Suppression: Not rendered on Transactional Screens -->
<main class="flex-grow flex flex-col items-center justify-center px-6 py-12 relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-surface-container-low blur-3xl opacity-50"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-secondary-container/30 blur-3xl opacity-50"></div>
<div class="w-full max-w-md z-10">
<!-- Branding -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container-lowest rounded-xl shadow-sm mb-6">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="directions_car">directions_car</span>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tight text-on-surface mb-2">Welcome back</h1>
<p class="text-on-surface-variant text-base">Sign in to manage your vehicle concierge.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-lg p-8 shadow-[0_10px_30px_-5px_rgba(43,52,55,0.04)]">
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-md px-5 py-4 text-on-surface placeholder:text-outline-variant transition-all" id="email" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center ml-1">
<label class="block text-xs font-bold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-bold text-primary hover:opacity-70 transition-opacity" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-md px-5 py-4 text-on-surface placeholder:text-outline-variant transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-bold py-4 rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-bold">
<span class="bg-surface-container-lowest px-4 text-outline-variant">Or continue with</span>
</div>
</div>
<!-- Biometric Action -->
<button class="w-full bg-surface-container-low text-on-surface font-semibold py-4 rounded-full hover:bg-surface-container transition-colors flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="fingerprint">fingerprint</span>
<span>FaceID / TouchID</span>
</button>
</div>
<!-- Footer Links -->
<div class="mt-12 text-center space-y-4">
<p class="text-on-surface-variant text-sm">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline underline-offset-4 ml-1" href="#">Create Account</a>
</p>
<div class="flex items-center justify-center gap-6 pt-4">
<a class="text-[10px] font-bold uppercase tracking-widest text-outline-variant hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<a class="text-[10px] font-bold uppercase tracking-widest text-outline-variant hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>
</main>
<!-- Visual Polish: Floating Image Bleed -->
<div class="hidden lg:block fixed -bottom-20 -right-20 w-[40rem] pointer-events-none opacity-20 transform -rotate-12">
<img alt="Luxury car detail" class="w-full h-auto rounded-xl" data-alt="Close-up of a high-end luxury car steering wheel and dashboard with premium leather textures in soft editorial lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrPLgc81hJHBaIHf1VILIciWTbqAD3Zx_TZ3wF0mk6oY3UNHeuYTuP6Fy4DdeN94CEDrxHU2DOGPYpNE0Hu1mL7v0ruE3S4fPUjXHe-0n9718gw_9LnU3jFcbF9iK4WWfy6HVOQk2WWdbX4DAGsA1ndeZjZCVBp2_TRZN2nPuac56A_NuuG-PSdnVj-encivrmWgSV95tE-mtlVLo7jnbGunNVYQYWOHXw5IWlHjjy6bJbGEA-cryyc3dHrFN9XN5XvMs4KoMi-Dgj"/>
